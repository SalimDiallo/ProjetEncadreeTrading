[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oil-sentiment-pipeline"
version = "0.1.0"
description = "Pipeline NLP de sentiment pétrolier et backtesting de signaux de trading"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Oil Sentiment Pipeline" }]
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    "yfinance>=0.2.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "lxml>=4.9.0",
    "feedparser>=6.0.0",
    "nltk>=3.8.0",
    "textblob>=0.17.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.6.0",
    "pyyaml>=6.0.0",
    "seaborn>=0.12.0",
    "python-dateutil>=2.8.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.65.0",
    "praw>=7.7.0",
    "pyarrow>=24.0.0",
]

[project.optional-dependencies]
ml = [
    "transformers>=4.30.0",
    "torch>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]

[project.scripts]
oil-sentiment = "oil_sentiment_pipeline.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["oil_sentiment_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: tests lourds (FinBERT, torch)",
]

[tool.black]
line-length = 100
target-version = ["py310"]
